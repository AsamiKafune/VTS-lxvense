<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>overlay</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body {
            font-family: "Kanit", serif;
        }
    </style>
</head>

<body>
    <div class="max-w-5xl mx-auto">
        <div class="px-1 text-2xl font-bold text-white drop-shadow-lg">
            คิว
        </div>
        <div id="board" class="grid grid-cols-1 gap-2 mt-1">
        </div>
    </div>
</body>

<script>
    setInterval(async () => {
        let queues = await getQueues()
        let html = ""
        queues.forEach(e => {
            html +=
                `<div class="flex text-xl rounded-sm w-full justify-between gap-2 bg-black/40 text-white drop-shadow-xl px-2 py-2">
                <div class="w-full truncate">
                    ${e.name}
                </div>
                <div class="w-[180px] text-end">
                    ${e.value} s.
                </div>
            </div>`
        });

        document.getElementById("board").innerHTML = html
    }, 1000);

    function getQueues() {
        const requestOptions = {
            method: "GET",
            redirect: "follow"
        };

        return fetch("http://localhost:8002/q", requestOptions)
            .then((response) => response.json())
            .then((result) => {
                return result;
            })
            .catch((error) => console.error(error));
    }
</script>

</html>
